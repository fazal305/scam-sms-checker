<!doctype html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحہ نہیں ملا · فراڈ میسج چیکر</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: #f4f3ef;
        color: #1b1f24;
        font: 26px/1.8 'Noto Naskh Arabic', 'Segoe UI', Tahoma, sans-serif;
        text-align: center;
      }
      main { max-width: 32rem; }
      h1 { font-size: 32px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: #49515b; }
      a {
        display: inline-block;
        min-height: 64px;
        padding: 12px 28px;
        box-sizing: border-box;
        border-radius: 20px;
        background: #1745a8;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible { outline: 4px solid #111111; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>یہ صفحہ نہیں ملا</h1>
      <p>شاید لنک غلط لکھا گیا ہے۔ کوئی بات نہیں۔</p>
      <a href="/">میسج چیک کرنے والے صفحے پر جائیں</a>
    </main>
  </body>
</html>
